[scan]
# Allowlist of scan roots, relative to --project-root.
# Empty (or omitted) means scan the whole project root.
include_dirs = ["Source", "Plugins"]

# Excludes win over include_dirs. Match by name, relative path, or a "*" glob segment.
exclude_patterns = [
  ".git",
  ".brain",
  "target",
  "Binaries",
  "Build",
  "DerivedDataCache",
  "Intermediate",
  "Saved",
  "node_modules",
  "dist",
  "obj",
  "Plugins/*/ThirdParty",
]

# File extensions to scan (leading dot optional, case-insensitive).
include_extensions = [".ts", ".tsx", ".js", ".jsx", ".mjs", ".cjs", ".py", ".cpp", ".c", ".h", ".hpp", ".cc", ".cxx", ".hh", ".hxx", ".cs"]

# Skip files larger than this (KiB).
max_file_size_kib = 1024

[index]
# Index/state location, relative to the project root unless absolute. Overridden by --state-dir.
# The state dir doubles as the project brain home: <project>/.brain/ converges
# config (brain.toml), private knowledge (knowledge/), project packs (packs/)
# and the generated index (index/) into a single project-root entry.
state_dir = ".brain"

# Project-private knowledge document roots, resolved relative to --project-root.
# Documents live directly under these roots (scanned recursively).
docs_dirs = [".brain/knowledge", "knowledge"]

# Shared knowledge bases to enable at query time. One pack = one database
# (<pack>/.brain/pack.db), built via `brain-rs compile --pack <dir>`.
# Resolved in order: <project>/.brain/packs/<name>, then <project>/packs/<name>,
# then <engine>/packs/<name>.
enabled_packs = ["ue-lyra"]

# Optional Context-Envelope identity (defaults to the project directory name).
# repo = "MyProject"

# Optional default domain identity, applied only when a document's frontmatter declares none.
# system = "Combat"

[retrieval]
max_results = 10
max_graph_depth = 3
max_graph_nodes = 2000
