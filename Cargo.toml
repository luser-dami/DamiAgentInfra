[package]
name = "brain-rs"
version = "0.1.0"
edition = "2024"
description = "Rust-native project knowledge index and query engine for coding agents"
license = "MIT"

[[bin]]
name = "brain-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
blake3 = "1.5"
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
rayon = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
walkdir = "2.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
