[package]
name = "alexandria"
version = "0.1.2"
edition = "2024"
description = "Rust-native project knowledge index and query engine for coding agents"
license = "MIT"

[[bin]]
name = "alexandria"
path = "src/main.rs"

[features]
default = []
neural = ["candle-core", "candle-nn", "candle-transformers", "tokenizers"]

[dependencies]
anyhow = "1.0"
blake3 = "1.5"
candle-core = { version = "0.8", optional = true }
candle-nn = { version = "0.8", optional = true }
candle-transformers = { version = "0.8", optional = true }
clap = { version = "4.5", features = ["derive"] }
regex = "1.11"
rayon = "1.10"
rusqlite = { version = "0.32", features = ["bundled"] }
serde_yaml = "0.9"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = { version = "0.21", optional = true }
toml = "0.8"
walkdir = "2.5"
tree-sitter = "0.26.11"
tree-sitter-cpp = "0.23.4"
tree-sitter-rust = "0.24.2"
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-javascript = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-c-sharp = "0.23.5"

[profile.release]
lto = true
codegen-units = 1
strip = true
# Size over marginal speed: the workload is I/O- and regex-bound, so the
# throughput difference of "z" vs 3 is unmeasurable here.
opt-level = "z"
# No unwinding in a CLI: drops landing pads and panic tables. Tests are
# unaffected (they run in the dev profile); a panic still prints to stderr
# before aborting.
panic = "abort"
